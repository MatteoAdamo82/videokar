<!doctype html>
<meta charset="utf-8">
<title>videokar — sync</title>
<style>
  :root {
    --bg: #14131c; --panel: #1c1b26; --line: #2a2836; --ink: #e6e3f0;
    --dim: #8d89a3; --on: #ffeebe; --off: #9b95b4; --ball: #ff7846;
    --pin: #6fd08c; --flag: #e5c07b; --bad: #e06c75;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; row-gap: 8px; flex-wrap: wrap;
           padding: 10px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  button { background: #2b293a; color: var(--ink); border: 1px solid #3a3750;
           border-radius: 6px; padding: 5px 11px; cursor: pointer; font: inherit; }
  button:hover { background: #35324a; }
  button.primary { background: #3d5afe22; border-color: #5b6bd6; }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 108px; }
  .speed { color: var(--dim); display: flex; align-items: center; gap: 5px; }
  select { background: #2b293a; color: var(--ink); border: 1px solid #3a3750;
           border-radius: 6px; padding: 4px 6px; font: inherit; }
  .grow { flex: 1; }
  #status { color: var(--dim); }
  #version { color: #55506a; font-variant-numeric: tabular-nums; }
  #status.bad { color: var(--bad); }
  #status.good { color: var(--pin); }

  main { display: flex; height: calc(100vh - 49px); }
  #side { width: 268px; flex: none; overflow-y: auto; background: var(--panel);
          border-right: 1px solid var(--line); }
  #side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--dim); margin: 14px 12px 6px; font-weight: 600; }
  .row { padding: 5px 12px; cursor: pointer; display: flex; gap: 7px; align-items: baseline; }
  .row:hover { background: #24222f; }
  .row.active { background: #2f2c40; }
  .row .id { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 30px; }
  .row .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.flagged .txt { color: var(--flag); }
  .row.muted .txt { color: var(--dim); text-decoration: line-through; }

  #scroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; }
  #track { position: relative; height: 100%; }
  canvas { position: absolute; inset: 0; }
  #lines { position: absolute; left: 0; right: 0; top: 190px; height: 132px; }

  .lineblock { position: absolute; height: 96px; border-radius: 7px;
               background: #221f2e; border: 1px solid #363248; cursor: grab; }
  .lineblock.pinned { border-color: var(--pin); background: #1e2a24; }
  .lineblock.muted { opacity: .4; border-style: dashed; }
  .lineblock.flagged { border-color: var(--flag); }
  .lineblock.sel { box-shadow: 0 0 0 2px #5b6bd6; }
  .lineblock .label { position: absolute; top: -18px; left: 0; font-size: 11px;
                      color: var(--dim); white-space: nowrap; }
  .lineblock .tools { position: absolute; top: -19px; right: 0; display: flex; gap: 4px; }
  .lineblock .tools button { padding: 0 6px; font-size: 11px; line-height: 16px; }

  .word { position: absolute; top: 26px; height: 44px; border-radius: 5px;
          background: #322e45; border: 1px solid #443f5e; color: var(--off);
          display: flex; align-items: center; justify-content: center;
          padding: 0 6px; cursor: grab; overflow: hidden; white-space: nowrap;
          font-size: 12px; }
  /* Grab the middle to move the word, an edge to change how long it lasts. */
  .grip { position: absolute; top: 0; bottom: 0; width: 6px; cursor: ew-resize; }
  .grip.l { left: -1px; } .grip.r { right: -1px; }
  .word:hover .grip { background: #6f8bff88; }
  .word.resizing { border-color: #6f8bff; }
  .word.sung { background: #4a3f2a; border-color: #7a6438; color: var(--on); }
  .word.manual { border-bottom: 2px solid var(--ball); }
  /* A real input rather than a contenteditable chip: focus, select-all, Enter
     and Escape all behave, and there is no editable node for a re-render to
     pull out from under the caret. */
  .lineedit { position: fixed; z-index: 20; height: 32px; border-radius: 6px;
              background: #1f2b3a; border: 1px solid #6f8bff; color: #fff;
              font: 13px ui-sans-serif, sans-serif; padding: 0 8px; }
  .wordedit { position: fixed; z-index: 20; height: 44px; border-radius: 5px;
              background: #1f2b3a; border: 1px solid #5b6bd6; color: #fff;
              text-align: center; font: 12px ui-sans-serif, sans-serif; padding: 0 4px; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ball);
              pointer-events: none; z-index: 3; }
  #loopband { position: absolute; top: 0; bottom: 0; background: #6f8bff14;
              border-left: 1px solid #6f8bff66; border-right: 1px solid #6f8bff66;
              pointer-events: none; display: none; }
  button.on { background: #6f8bff33; border-color: #6f8bff; color: #fff; }
  /* Fixed to the window, not the track: pinned to the track it scrolled out of
     sight the moment you looked at anything past the intro. */
  .title { color: var(--ink); font-weight: 600; max-width: 220px; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  #veil { position: fixed; inset: 0; background: #0b0a12cc; z-index: 40;
          display: none; align-items: flex-start; justify-content: center; padding: 60px 20px; }
  #veil.open { display: flex; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           width: min(720px, 100%); max-height: 100%; overflow-y: auto; padding: 20px 22px; }
  .sheet h1 { font-size: 16px; margin: 0 0 4px; }
  .sheet h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
              color: var(--dim); margin: 22px 0 8px; }
  .sheet p { color: var(--dim); margin: 4px 0 0; }
  .sheet label { display: block; color: var(--dim); margin: 10px 0 4px; }
  .sheet input[type=file], .sheet textarea, .sheet select, .sheet input[type=text] {
    width: 100%; background: #14131c; color: var(--ink); border: 1px solid #3a3750;
    border-radius: 7px; padding: 8px 10px; font: inherit; }
  .sheet textarea { min-height: 150px; resize: vertical;
                    font: 12px/1.5 ui-monospace, SFMono-Regular, monospace; }
  .sheet .actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 7px;
          cursor: pointer; border: 1px solid transparent; }
  .item:hover { background: #24222f; border-color: #3a3750; }
  .item.current { border-color: #6f8bff; }
  .item .meta { color: var(--dim); font-size: 11px; margin-left: auto; white-space: nowrap; }
  .item .discard { padding: 1px 7px; font-size: 12px; opacity: 0; }
  .item:hover .discard { opacity: 1; }
  .item .discard:hover { background: #4a2530; border-color: var(--bad); color: #ffd9df; }
  .item .confirm { display: flex; gap: 6px; align-items: center; margin-left: 10px;
                   color: var(--bad); white-space: nowrap; }
  .item .confirm button { padding: 1px 8px; font-size: 11px; }
  .item .confirm .yes { border-color: var(--bad); color: #ffd9df; }
  .job { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; }
  .bar { height: 5px; background: #14131c; border-radius: 3px; overflow: hidden; margin-top: 7px; }
  .bar i { display: block; height: 100%; background: #6f8bff; width: 0; transition: width .2s; }
  .preview { display: block; width: 100%; border-radius: 8px; margin: 12px 0 4px;
             background: #0d0c14; border: 1px solid var(--line); }
  input[type=range] { width: 100%; accent-color: #6f8bff; }
  /* Feedback for something done inside the sheet belongs inside the sheet. The
     status bar is in the far corner of a window covered by a modal. */
  .sheetsay { margin: 10px 0 0; min-height: 1.2em; }
  .sheetsay.bad { color: var(--bad); font-weight: 600; }
  .sheetsay.good { color: var(--pin); }
  .job.failed { border-color: var(--bad); }
  .job.done { border-color: var(--pin); }
  a.dl { color: #9fb4ff; }

  /* A dead server is the one failure that makes everything look frozen, so it
     gets a band across the top rather than a line in the status bar. */
  body.offline header { box-shadow: inset 0 3px 0 var(--bad); }
  body.offline #status { color: var(--bad); font-weight: 600; }
  #hint { position: fixed; bottom: 10px; left: 282px; right: 14px; color: var(--dim);
          font-size: 11px; pointer-events: none; text-shadow: 0 0 6px var(--bg); }
</style>

<header>
  <button id="library">☰ Songs</button>
  <span id="title" class="title">—</span>
  <button id="play">▶︎ Play</button>
  <span class="time" id="clock">0:00.00 / 0:00.00</span>
  <button id="loop">↻ Loop</button>
  <label class="speed">speed
    <select id="speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
    </select>
  </label>
  <button id="zoomout">−</button><button id="zoomin">+</button>
  <button id="undo" disabled>↶ Undo</button>
  <button id="export">⤓ Export</button>
  <span class="grow"></span>
  <span id="version" title="the page this tab is running">{{version}}</span>
  <span id="status">loading…</span>
</header>

<main>
  <aside id="side"></aside>
  <div id="scroll">
    <div id="track">
      <canvas id="wave"></canvas>
      <div id="hint">drag a line to move it (later lines follow, up to a pin) · drag a word to nudge it, or its edge to change how long it lasts · double-click a word to retype it · [ and ] slow the song down and speed it back up · l loops the selected line</div>
      <div id="lines"></div>
      <div id="loopband"></div>
      <div id="playhead"></div>
    </div>
  </div>
</main>

<div id="veil"><div class="sheet" id="sheet"></div></div>

<audio id="audio" preload="auto"></audio>

<script>
const $ = (s) => document.querySelector(s);
const audio = $("#audio"), scroll = $("#scroll"), track = $("#track"),
      linesEl = $("#lines"), head = $("#playhead"), wave = $("#wave"), side = $("#side");

let state = null, peaks = null, pps = 110, duration = 0, selected = null, follow = true;
let undoDepth = 0, loopOn = false;
// Word id -> word, rebuilt when the document changes rather than looked up by
// scanning every word for every word on every frame.
let wordIndex = new Map();

// Enough run-up to hear the beat the first word lands on, and enough tail not to
// clip the last one before it comes round again.
const LOOP_LEAD = 0.6, LOOP_TAIL = 0.4;

function loopBounds() {
  if (!loopOn || !selected) return null;
  const line = lines().find((l) => l.id === selected);
  if (!line || line.start == null) return null;
  return [Math.max(0, line.start - LOOP_LEAD), line.end + LOOP_TAIL];
}

const fmt = (t) => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}.${String(Math.floor(t%1*100)).padStart(2,"0")}`;
const say = (msg, kind="") => { const s = $("#status"); s.textContent = msg; s.className = kind; };

class Offline extends Error {}

async function api(path, options) {
  let response;
  try {
    response = await fetch(path, options);
  } catch (err) {
    // fetch only rejects when the request never got an answer. Told apart from
    // an HTTP error because the page looks frozen either way, and the two need
    // completely different things from the reader.
    throw new Offline("the server is not answering — is `videokar serve` still running?");
  }
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return response.json();
}

function report(err) {
  say(err.message, "bad");
  document.body.classList.toggle("offline", err instanceof Offline);
}

async function load() {
  setRate(parseFloat($("#speed").value));
  try {
    state = await api("/api/song");
  } catch {
    // Started on the library rather than on a document. That is a normal way
    // in, not an error to shout about.
    say("no song open yet — pick one, or add one");
    $("#library").click();
    return;
  }
  duration = state.song.audio.duration;
  audio.src = "/api/audio";
  $("#title").textContent = state.song.audio.path.split("/").pop();
  try { peaks = await api("/api/peaks"); } catch { peaks = null; }
  layout();
  render();
  say(`${lines().length} lines · ${state.suspicious.length} flagged`);
}

const lines = () => (state ? state.song.sections.flatMap((s) => s.lines) : []);

function layout() {
  const width = Math.max(900, Math.round(duration * pps));
  track.style.width = width + "px";
  wave.width = width; wave.height = 320;
  wave.style.width = width + "px"; wave.style.height = "320px";
  drawWave();
}

function drawWave() {
  const ctx = wave.getContext("2d");
  ctx.clearRect(0, 0, wave.width, wave.height);
  const mid = 95, half = 78;
  if (peaks) {
    const perSecond = peaks.buckets_per_second;
    ctx.fillStyle = "#3a3550";
    for (let x = 0; x < wave.width; x++) {
      const t = x / pps;
      const from = Math.floor(t * perSecond), to = Math.max(from + 1, Math.floor((x + 1) / pps * perSecond));
      let peak = 0;
      for (let i = from; i < to && i < peaks.peaks.length; i++) peak = Math.max(peak, peaks.peaks[i]);
      const h = (peak / 255) * half;
      ctx.fillRect(x, mid - h, 1, h * 2);
    }
  }
  // Vocal regions: where the stem says someone is singing.
  ctx.fillStyle = "#6fd08c22";
  for (const [a, b] of state.song.vocal_regions) ctx.fillRect(a * pps, 8, (b - a) * pps, 10);
  // A second grid, so a drag has something to read distance against.
  ctx.strokeStyle = "#ffffff10"; ctx.fillStyle = "#6b6683"; ctx.font = "10px ui-monospace, monospace";
  const step = pps < 40 ? 10 : pps < 90 ? 5 : 1;
  for (let t = 0; t < duration; t += step) {
    const x = Math.round(t * pps) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 24); ctx.lineTo(x, wave.height); ctx.stroke();
    ctx.fillText(fmt(t).slice(0, -3), x + 3, 34);
  }
}

function render() {
  linesEl.innerHTML = ""; side.innerHTML = "";
  if (!state) return;
  const flaggedHeading = document.createElement("h2");
  flaggedHeading.textContent = "lines";
  side.append(flaggedHeading);

  for (const line of lines()) {
    const row = document.createElement("div");
    row.className = "row" + (state.suspicious.includes(line.id) ? " flagged" : "") + (line.sung ? "" : " muted");
    row.dataset.line = line.id;
    const off = (state.off_the_attack || {})[line.id];
    if (line.flags.includes("off_the_attack")) {
      // Which way to drag it, not merely that something is wrong.
      row.title = `starts ${off > 0 ? "after" : "before"} the voice comes in, by ${Math.abs(off).toFixed(2)}s`;
    }
    row.ondblclick = (event) => { event.stopPropagation(); retypeLine(line); };
    if (selected === line.id) row.classList.add("active");
    row.innerHTML = `<span class="id">${line.id}</span><span class="txt">${escapeHtml(wordsText(line))}</span>`;
    row.onclick = () => {
      select(line.id);
      if (line.start != null) seek(line.start - 0.4, {centre: true});
    };
    side.append(row);
    if (line.start == null) continue;

    const block = document.createElement("div");
    block.className = "lineblock"
      + (line.pinned ? " pinned" : "") + (line.sung ? "" : " muted")
      + (state.suspicious.includes(line.id) ? " flagged" : "")
      + (selected === line.id ? " sel" : "");
    block.style.left = line.start * pps + "px";
    block.style.width = Math.max(26, (line.end - line.start) * pps) + "px";
    block.dataset.line = line.id;
    const offBy = (state.off_the_attack || {})[line.id];
    const offNote = line.flags.includes("off_the_attack")
      ? ` · ${offBy > 0 ? "+" : ""}${offBy.toFixed(2)}s from the attack` : "";
    block.innerHTML = `<span class="label">${line.id} · ${line.start.toFixed(2)}${
      line.flags.length ? " · " + line.flags.join(",") : ""}${offNote}</span>`;
    block.querySelector(".label").ondblclick = (event) => {
      event.stopPropagation();
      retypeLine(line);
    };

    const tools = document.createElement("div");
    tools.className = "tools";
    tools.append(
      toolButton(line.pinned ? "📌 pinned" : "pin", () => edit({op:"pin", line:line.id, value:!line.pinned})),
      toolButton(line.sung ? "mute" : "🔇 muted", () => edit({op:"mute", line:line.id, value:!line.sung})),
    );
    block.append(tools);

    for (const word of line.words) {
      if (word.start == null) continue;
      const el = document.createElement("div");
      el.className = "word" + (word.manual ? " manual" : "");
      el.style.left = (word.start - line.start) * pps + "px";
      el.style.width = Math.max(16, (word.end - word.start) * pps) + "px";
      el.textContent = word.text;
      // The chip is as wide as the word is long in time, which at a normal zoom
      // is narrower than the word itself.
      el.title = `${word.text}  ${word.start.toFixed(2)}–${word.end.toFixed(2)}`;
      el.dataset.word = word.id;
      el.ondblclick = (event) => { event.stopPropagation(); retype(el, word); };
      for (const side of ["l", "r"]) {
        const grip = document.createElement("div");
        grip.className = "grip " + side;
        grip.dataset.side = side;
        el.append(grip);
      }
      block.append(el);
    }
    linesEl.append(block);
  }
  wordIndex = new Map(lines().flatMap((line) => line.words.map((w) => [w.id, w])));
  drawLoop();
}

const wordsText = (line) => line.words.map((w) => w.text).join(" ");
const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function toolButton(label, onClick) {
  const b = document.createElement("button");
  b.textContent = label;
  b.onmousedown = (e) => e.stopPropagation();
  b.onclick = (e) => { e.stopPropagation(); onClick(); };
  return b;
}

function drawLoop() {
  const bounds = loopBounds();
  const band = $("#loopband");
  if (!bounds) { band.style.display = "none"; return; }
  band.style.display = "block";
  band.style.left = bounds[0] * pps + "px";
  band.style.width = (bounds[1] - bounds[0]) * pps + "px";
}

function select(id) {
  // Class toggle rather than a re-render: rebuilding the DOM on mousedown
  // detaches the element the double-click is about to land on, so retyping a
  // word never fired.
  selected = id;
  for (const block of document.querySelectorAll(".lineblock")) {
    block.classList.toggle("sel", block.dataset.line === id);
  }
  for (const row of document.querySelectorAll("#side .row")) {
    row.classList.toggle("active", row.dataset.line === id);
  }
  drawLoop();
}

async function edit(body) {
  say("saving…");
  try {
    const result = await api("/api/edit", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
    });
    state = result;
    undoDepth = result.undo_depth ?? undoDepth;
    $("#undo").disabled = undoDepth === 0;
    render();
    say(result.edit.description + ` · ${state.suspicious.length} still flagged`, "good");
  } catch (err) {
    // A refused drag is information, not a failure: the timeline would have
    // inverted, and the server says which line it collided with.
    report(err);
    render();
  }
}

function retype(el, word) {
  const box = el.getBoundingClientRect();
  const input = document.createElement("input");
  input.className = "wordedit";
  input.value = word.text;
  Object.assign(input.style, {
    left: box.left + "px", top: box.top + "px", width: Math.max(70, box.width) + "px",
  });
  document.body.append(input);
  input.focus();
  input.select();

  let done = false;
  const finish = async (commit) => {
    if (done) return;
    done = true;
    const text = input.value.trim();
    input.remove();
    if (!commit || !text || text === word.text) return;
    await edit({op: "set_text", word: word.id, text});
  };
  input.onblur = () => finish(true);
  input.onkeydown = (event) => {
    event.stopPropagation();
    if (event.key === "Enter") finish(true);
    if (event.key === "Escape") finish(false);
  };
}

function retypeLine(line) {
  // A field on the page rather than window.prompt, for the same reason: a
  // browser told to stop showing dialogs returns null from it without asking.
  document.querySelectorAll(".lineedit").forEach((old) => old.remove());
  const current = line.words.map((w) => w.text).join(" ");
  const block = linesEl.querySelector(`[data-line="${line.id}"]`);
  const box = block ? block.getBoundingClientRect() : {left: 80, top: 120, width: 460};

  const field = document.createElement("input");
  field.className = "lineedit";
  field.value = current;
  Object.assign(field.style, {
    left: Math.max(8, box.left) + "px",
    top: Math.max(60, box.top - 34) + "px",
    width: Math.max(320, box.width) + "px",
  });
  document.body.append(field);
  field.focus();
  field.select();

  let done = false;
  const finish = async (commit) => {
    if (done) return;
    done = true;
    const typed = field.value.trim();
    field.remove();
    if (!commit || !typed || typed === current) return;
    await edit({op: "set_line_text", line: line.id, text: typed});
  };
  field.onblur = () => finish(true);
  field.onkeydown = (event) => {
    event.stopPropagation();
    if (event.key === "Enter") finish(true);
    if (event.key === "Escape") finish(false);
  };
}

// ---- dragging -------------------------------------------------------------
let drag = null;

linesEl.addEventListener("mousedown", (event) => {
  const wordEl = event.target.closest(".word");
  const blockEl = event.target.closest(".lineblock");
  if (!blockEl) return;
  event.preventDefault();
  const id = blockEl.dataset.line;
  select(id);
  const grip = event.target.closest(".grip");
  const element = wordEl || blockEl;
  drag = {
    kind: grip ? "resize" : wordEl ? "word" : "line",
    side: grip ? grip.dataset.side : null,
    id: wordEl ? wordEl.dataset.word : id,
    element,
    originX: event.clientX,
    startLeft: parseFloat(element.style.left),
    startWidth: element.getBoundingClientRect().width,
    offset: 0,
  };
  if (grip) element.classList.add("resizing");
});

window.addEventListener("mousemove", (event) => {
  if (!drag) return;
  drag.offset = (event.clientX - drag.originX) / pps;
  const shift = drag.offset * pps;
  if (drag.kind === "resize") {
    // Live feedback has to stay above zero width or the element collapses and
    // the grip disappears from under the cursor mid-drag.
    if (drag.side === "l") {
      const width = Math.max(6, drag.startWidth - shift);
      drag.element.style.left = drag.startLeft + (drag.startWidth - width) + "px";
      drag.element.style.width = width + "px";
    } else {
      drag.element.style.width = Math.max(6, drag.startWidth + shift) + "px";
    }
  } else {
    drag.element.style.left = drag.startLeft + shift + "px";
  }
  say(`${drag.kind} ${drag.id}: ${drag.offset >= 0 ? "+" : ""}${drag.offset.toFixed(2)}s`);
});

window.addEventListener("mouseup", async () => {
  if (!drag) return;
  const moved = drag;
  drag = null;
  moved.element.classList.remove("resizing");
  if (Math.abs(moved.offset) < 0.01) {
    // A click, not a drag. Put the element back where it was and leave the DOM
    // alone so a double-click still has something to land on.
    moved.element.style.left = moved.startLeft + "px";
    moved.element.style.width = moved.startWidth + "px";
    return;
  }
  if (moved.kind === "line") {
    await edit({op: "shift_line", line: moved.id, by: round(moved.offset)});
  } else {
    const word = lines().flatMap((l) => l.words).find((w) => w.id === moved.id);
    if (moved.kind === "resize") {
      const bound = moved.side === "l"
        ? {start: round(word.start + moved.offset)}
        : {end: round(word.end + moved.offset)};
      await edit({op: "resize_word", word: moved.id, ...bound});
    } else {
      await edit({op: "move_word", word: moved.id, to: round(word.start + moved.offset)});
    }
  }
});

const round = (v) => Math.round(v * 1000) / 1000;

// Heights the presets render at, so a margin given as a percentage can be
// turned into the pixels the schema wants.
const PRESET_HEIGHT = {alpha: 1080, youtube: 1080, minimal: 1080, shorts: 1920};
const presetHeight = (name) => PRESET_HEIGHT[name] || 1080;
// The size the renderer would pick on its own, so the control is a multiple of
// what a preset already looks right at rather than a bare pixel count.
const defaultSize = (name) => Math.max(12, Math.round(presetHeight(name) / 17));

function previewTime() {
  // The line under the playhead, or the next one along: previewing a frame with
  // nothing drawn on it tells you nothing about where the words sit.
  const here = audio.currentTime;
  const timed = lines().filter((line) => line.start != null);
  const active = timed.find((line) => line.start <= here && here <= line.end);
  if (active) return here;
  const next = timed.find((line) => line.start > here) || timed[0];
  return next ? next.start + Math.min(0.6, (next.end - next.start) / 2) : here;
}

function watchJob(job, onFinish) {
  const box = $("#jobs");
  if (!box) return;
  const draw = (state) => {
    const pct = state.progress >= 0 ? Math.round(state.progress * 100) : null;
    box.innerHTML = `
      <div class="job ${state.status}">
        <div><b>${esc(state.label)}</b> — ${esc(state.error || state.message || state.status)}</div>
        ${pct === null ? "" : `<div class="bar"><i style="width:${pct}%"></i></div>`}
        ${state.status === "done" && state.file
          ? `<p><a class="dl" href="#" data-file="${esc(state.file)}">download ${esc(state.file)}</a></p>`
          : ""}
      </div>`;
  };
  draw(job);
  if (jobTimer) clearInterval(jobTimer);
  jobTimer = setInterval(async () => {
    let state;
    try { state = await api(`/api/jobs/${job.id}`); } catch { return; }
    draw({...job, ...state});
    if (state.status !== "running") {
      clearInterval(jobTimer);
      jobTimer = null;
      const done = state.status === "done";
      sheetSay(done ? `${state.label} ready` : state.error, done ? "good" : "bad");
      if (onFinish) onFinish({...job, ...state});
    }
  }, 700);
}

async function saveOutput(name) {
  const url = "/api/output/" + encodeURIComponent(name);
  // Ask for one byte first. A plain <a download> saves whatever comes back,
  // so an error page ends up on disk as a file named like the video.
  try {
    const probe = await fetch(url, {headers: {Range: "bytes=0-0"}});
    if (!probe.ok && probe.status !== 206) {
      let detail = probe.statusText;
      try { detail = (await probe.json()).detail || detail; } catch {}
      throw new Error(detail);
    }
  } catch (err) {
    report(err);
    return;
  }
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  link.click();
  say(`saving ${name}`, "good");
}

function adopt(result) {
  state = result;
  duration = state.song.audio.duration;
  audio.src = "/api/audio?" + Date.now();
  selected = null;
  undoDepth = 0;
  $("#undo").disabled = true;
  $("#title").textContent = state.song.audio.path.split("/").pop();
  peaks = null;
  api("/api/peaks").then((p) => { peaks = p; layout(); render(); }).catch(() => {});
  layout();
  render();
  say(`${lines().length} lines · ${state.suspicious.length} flagged`);
}

// ---- transport ------------------------------------------------------------
function seek(t, { centre = false } = {}) {
  audio.currentTime = Math.max(0, t);
  // Moving the clock without moving the view looks like nothing happened, which
  // is exactly how clicking a line used to feel while paused.
  const x = audio.currentTime * pps;
  if (centre || x < scroll.scrollLeft + 40 || x > scroll.scrollLeft + scroll.clientWidth - 40) {
    scroll.scrollLeft = Math.max(0, x - scroll.clientWidth / 3);
  }
  tick();
}

$("#loop").onclick = () => {
  loopOn = !loopOn;
  $("#loop").classList.toggle("on", loopOn);
  drawLoop();
  const bounds = loopBounds();
  if (loopOn && !bounds) {
    say("pick a line first — loop repeats the selected one", "bad");
  } else if (bounds) {
    seek(bounds[0]);
    say(`looping ${selected} at ${audio.playbackRate}×`);
  }
};

$("#speed").onchange = () => setRate(parseFloat($("#speed").value));

function setRate(rate) {
  audio.playbackRate = rate;
  // Pitch correction is the point: half speed an octave down is harder to
  // place a word in, not easier. The prefixed names are for older engines.
  for (const key of ["preservesPitch", "mozPreservesPitch", "webkitPreservesPitch"]) {
    if (key in audio) audio[key] = true;
  }
  $("#speed").value = String(rate);
}

$("#play").onclick = () => audio.paused ? audio.play() : audio.pause();
audio.onplay = () => $("#play").textContent = "❚❚ Pause";
audio.onpause = () => $("#play").textContent = "▶︎ Play";

scroll.addEventListener("mousedown", (event) => {
  if (event.target === wave) { follow = false; seek((event.offsetX) / pps); }
});
scroll.addEventListener("scroll", () => { if (!audio.paused) follow = false; });

window.addEventListener("keydown", (event) => {
  if (event.target.tagName === "INPUT") return;
  if (event.code === "Space") { event.preventDefault(); $("#play").click(); }
  if ((event.metaKey || event.ctrlKey) && event.key === "z") { event.preventDefault(); $("#undo").click(); }
  if (event.key === "ArrowLeft") seek(audio.currentTime - (event.shiftKey ? 5 : 1));
  if (event.key === "ArrowRight") seek(audio.currentTime + (event.shiftKey ? 5 : 1));
  // Step through the speeds without reaching for the menu.
  if (event.key === "l") { $("#loop").click(); }
  if (event.key === "Escape") closeSheet();
  if (event.key === "[" || event.key === "]") {
    const rates = [0.25, 0.5, 0.75, 1];
    const at = rates.indexOf(audio.playbackRate);
    const next = at < 0 ? 3 : Math.min(rates.length - 1, Math.max(0, at + (event.key === "]" ? 1 : -1)));
    setRate(rates[next]);
    say(`speed ${rates[next]}×`);
  }
});

$("#undo").onclick = async () => {
  try {
    const result = await api("/api/undo", {method: "POST"});
    state = result; undoDepth = result.undo_depth;
    $("#undo").disabled = undoDepth === 0;
    render();
    say(`undone · ${state.suspicious.length} flagged`, "good");
  } catch (err) { say(err.message, "bad"); }
};

$("#zoomin").onclick = () => setZoom(pps * 1.5);
$("#zoomout").onclick = () => setZoom(pps / 1.5);
function setZoom(value) {
  const anchor = audio.currentTime;
  // Canvas has a hard width limit; past it the waveform silently stops drawing.
  pps = Math.max(12, Math.min(value, 30000 / Math.max(duration, 1)));
  layout(); render();
  scroll.scrollLeft = anchor * pps - scroll.clientWidth / 2;
}

function tick() {
  if (!state) { requestAnimationFrame(tick); return; }
  const t = audio.currentTime;
  const bounds = loopBounds();
  // Only the far edge is enforced. Scrubbing to somewhere before the loop is a
  // deliberate act — playback runs into the region and starts repeating there.
  if (bounds && !audio.paused && t >= bounds[1]) audio.currentTime = bounds[0];
  head.style.left = t * pps + "px";
  $("#clock").textContent = `${fmt(t)} / ${fmt(duration)}`;
  for (const el of document.querySelectorAll(".word")) {
    const word = wordIndex.get(el.dataset.word);
    el.classList.toggle("sung", Boolean(word && word.start != null && t >= word.start));
  }
  if (follow && !audio.paused) {
    const x = t * pps;
    if (x < scroll.scrollLeft + 80 || x > scroll.scrollLeft + scroll.clientWidth - 160) {
      scroll.scrollLeft = x - scroll.clientWidth / 3;
    }
  }
  requestAnimationFrame(tick);
}

audio.onplay = () => { follow = true; $("#play").textContent = "❚❚ Pause"; };
// One quiet poll: a server that dies while the page is open otherwise leaves it
// looking frozen until something is clicked.
setInterval(async () => {
  try {
    await fetch("/api/library", {method: "HEAD"});
    document.body.classList.remove("offline");
  } catch {
    document.body.classList.add("offline");
    say("the server is not answering — is `videokar serve` still running?", "bad");
  }
}, 5000);

load().then(tick).catch(report);
</script>

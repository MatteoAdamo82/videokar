<!doctype html>
<meta charset="utf-8">
<title>videokar — sync</title>
<link rel="stylesheet" href="/static/style.css">

<header>
  <button id="library">☰ Songs</button>
  <span id="title" class="title">—</span>
  <button id="play">▶︎ Play</button>
  <span class="time" id="clock">0:00.00 / 0:00.00</span>
  <button id="loop">↻ Loop</button>
  <label class="speed">speed
    <select id="speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
    </select>
  </label>
  <button id="zoomout">−</button><button id="zoomin">+</button>
  <button id="undo" disabled>↶ Undo</button>
  <button id="export">⤓ Export</button>
  <span class="grow"></span>
  <span id="version" title="the page this tab is running">{{version}}</span>
  <span id="status">loading…</span>
</header>

<main>
  <aside id="side"></aside>
  <div id="scroll">
    <div id="track">
      <canvas id="wave"></canvas>
      <div id="hint">drag a line to move it (later lines follow, up to a pin) · drag a word to nudge it, or its edge to change how long it lasts · double-click a word to retype it · [ and ] slow the song down and speed it back up · l loops the selected line</div>
      <div id="lines"></div>
      <div id="loopband"></div>
      <div id="playhead"></div>
    </div>
  </div>
</main>

<div id="veil"><div class="sheet" id="sheet"></div></div>

<audio id="audio" preload="auto"></audio>

<script type="module" src="/static/js/main.js"></script>

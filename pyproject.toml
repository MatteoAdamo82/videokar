[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videokar"
version = "0.1.0"
description = "Bouncing-ball karaoke lyric videos from an audio track and its lyrics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matteo Adamo", email = "adamo.matteo@gmail.com" }]
keywords = ["karaoke", "lyrics", "forced-alignment", "video", "suno", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10.3",
    "soundfile>=0.12",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Heavy ML wheels live in extras so `pip install videokar` stays quick and so
# the torch pin never blocks a plain lyrics/render install.
align = ["torch>=2.3", "torchaudio>=2.3", "demucs>=4.0"]
whisper = ["faster-whisper>=1.0"]
whisperx = ["whisperx>=3.1"]
skia = ["skia-python>=87.6"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
all = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "demucs>=4.0",
    "faster-whisper>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/matteoadamo/videokar"
Issues = "https://github.com/matteoadamo/videokar/issues"

[project.scripts]
videokar = "videokar.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/videokar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the example audio and the ML extras"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The prototype is kept verbatim as a historical reference; it is not shipped.
extend-exclude = ["docs/prototype"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
